<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Elu 🧊 LIVE Meme Boxes</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1f102e, #08080e 72%);
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 12px 24px;
      user-select: none;
      overflow-x: hidden;
    }
    .header {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 14px;
      border-radius: 18px;
      margin-bottom: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #fe2c55, #25f4ee);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px;
    }
    .brand h1 { font-size: 16px; font-weight: 800; }
    .brand p { font-size: 11px; color: #25f4ee; }
    .conn-pill {
      background: rgba(255,255,255,0.12);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 800;
      color: #ffd166;
    }
    .conn-pill.live {
      background: #06d6a0;
      color: #041f17;
    }

    .box-hint {
      width: 100%;
      max-width: 420px;
      font-size: 12px;
      color: #eee;
      text-align: center;
      margin-bottom: 12px;
      background: rgba(254,44,85,0.14);
      border: 1px solid rgba(254,44,85,0.35);
      padding: 9px 12px;
      border-radius: 14px;
      line-height: 1.4;
    }
    .box-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 12px;
    }
    .m-box {
      aspect-ratio: 1;
      background: linear-gradient(145deg, #28193d, #130f1e);
      border: 2px solid rgba(254,44,85,0.55);
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.45);
      transition: transform 0.2s, border-color 0.2s;
    }
    .m-box.shaking { animation: boxShake 0.45s ease; border-color: #ffd166; }
    @keyframes boxShake {
      0%, 100% { transform: rotate(0deg) scale(1.06); }
      25% { transform: rotate(-10deg) scale(1.08); }
      50% { transform: rotate(10deg) scale(1.08); }
      75% { transform: rotate(-8deg) scale(1.08); }
    }
    .m-box.opened {
      background: linear-gradient(145deg, #2b1320, #160c14);
      border-color: #ffd166;
    }
    .m-icon { font-size: 28px; margin-bottom: 4px; }
    .m-num { font-size: 16px; font-weight: 900; color: #fff; }
    .m-mini-tag { font-size: 10px; font-weight: 800; color: #ffd166; margin-top: 2px; line-height: 1.2; }

    /* Live Activity Log */
    .live-log {
      width: 100%;
      max-width: 420px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px 12px;
      font-size: 12px;
      color: #ccc;
      margin-bottom: 12px;
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .reset-btn {
      width: 100%;
      max-width: 420px;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(37,244,238,0.4);
      background: rgba(37,244,238,0.12);
      color: #25f4ee;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
    }

    /* Fullscreen Meme Pop-out Modal */
    .meme-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 50;
    }
    .meme-card {
      width: 100%;
      max-width: 360px;
      background: #141420;
      border: 3px solid #ffd166;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(254, 44, 85, 0.6);
      animation: memePop 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      text-align: center;
    }
    @keyframes memePop {
      0% { transform: scale(0.25); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .picker-banner {
      background: linear-gradient(90deg, #fe2c55, #ff758f);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      padding: 7px 12px;
    }
    .meme-top-banner {
      background: #000;
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      padding: 8px 12px;
    }
    .meme-art {
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .meme-caption {
      background: #000;
      color: #ffd166;
      font-size: 14px;
      font-weight: 800;
      padding: 10px 14px;
      line-height: 1.4;
    }
    .meme-dare-box {
      padding: 14px;
      background: rgba(254, 44, 85, 0.14);
    }
    .dare-text { font-size: 15px; font-weight: 900; color: #fff; margin-bottom: 12px; }
    .close-meme-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #fe2c55, #ff5e7e);
      color: #fff;
      font-weight: 800;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="avatar">E</div>
      <div>
        <h1>Elu 🧊 LIVE Meme</h1>
        <p>TikTok Direct Sync</p>
      </div>
    </div>
    <div class="conn-pill" id="connPill">⏳ STANDALONE</div>
  </div>

  <div class="box-hint">
    💬 ኮሜንት ላይ <b>1 እስከ 6</b> ቁጥር ጻፉ ወይም <b>🎁 Gift</b> ላኩ—ሳጥኑ በራሱ ተከፍቶ Meme ያወጣል!
  </div>

  <div class="box-grid" id="boxGrid"></div>

  <div class="live-log" id="liveLog">📡 የ TikTok Live ኮሜንት በመጠባበቅ ላይ...</div>

  <button class="reset-btn" onclick="initBoxes()">🔄 ሳጥኖቹን በአዲስ Meme ሙላ</button>

  <!-- MEME POPUP MODAL -->
  <div class="meme-overlay" id="memeModal" onclick="closeMeme()">
    <div class="meme-card" onclick="event.stopPropagation()">
      <div class="picker-banner" id="pickerBanner">👤 ተመልካች ሳጥን መረጠ!</div>
      <div class="meme-top-banner" id="memeTop">ምን አልክ?! 👀</div>
      <div class="meme-art" id="memeArt"></div>
      <div class="meme-caption" id="memeCaption"></div>
      <div class="meme-dare-box">
        <div class="dare-text" id="memeDare"></div>
        <button class="close-meme-btn" onclick="closeMeme()">ቀጥል 👍 (ዝጋ)</button>
      </div>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function tone(freq, type, dur, delay = 0, slideTo = null) {
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime + delay);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, audioCtx.currentTime + delay + dur);
        gain.gain.setValueAtTime(0.16, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + dur);
      } catch (e) {}
    }

    function playFx(kind) {
      if (kind === "boom") tone(110, "sine", 0.55, 0, 32);
      else if (kind === "horn") {
        tone(440, "sawtooth", 0.14, 0);
        tone(440, "sawtooth", 0.14, 0.17);
        tone(554, "sawtooth", 0.42, 0.34);
      } else if (kind === "win") {
        [523, 659, 784, 1046].forEach((f, i) => tone(f, "triangle", 0.24, i * 0.09));
      } else if (kind === "sad") {
        tone(311, "sawtooth", 0.28, 0, 293);
        tone(277, "sawtooth", 0.28, 0.3, 261);
        tone(246, "sawtooth", 0.55, 0.6, 210);
      }
    }

    const MEMES = [
      {
        top: "ምን አልክ?! 👀",
        bg: "linear-gradient(135deg, #2b2d42, #1a1b26)",
        svg: `<svg width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="#ffd166" stroke="#fff" stroke-width="4"/>
          <circle cx="42" cy="50" r="14" fill="#fff"/><circle cx="78" cy="50" r="14" fill="#fff"/>
          <circle cx="48" cy="50" r="6" fill="#000"/><circle cx="84" cy="50" r="6" fill="#000"/>
          <path d="M44 84 L76 80" stroke="#000" stroke-width="5" stroke-linecap="round"/>
        </svg>`,
        caption: "ተመልካቹ ዝም ብሎ እያየ ስጦታ ሳይልክ ሲቀር...",
        dare: "🎯 10 ጊዜ Tap-Tap አድርግ!",
        sound: "boom"
      },
      {
        top: "ጉድ ፈላ! 😱",
        bg: "linear-gradient(135deg, #7209b7, #3a0ca3)",
        svg: `<svg width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="#ff9f1c" stroke="#fff" stroke-width="4"/>
          <circle cx="42" cy="46" r="12" fill="#fff"/><circle cx="78" cy="46" r="12" fill="#fff"/>
          <circle cx="42" cy="46" r="5" fill="#000"/><circle cx="78" cy="46" r="5" fill="#000"/>
          <ellipse cx="60" cy="82" rx="14" ry="20" fill="#111" stroke="#fff" stroke-width="3"/>
        </svg>`,
        caption: "PK ሊያልቅ 3 ሰከንድ ሲቀረው አንበሳ ሲገባ!",
        dare: "💃 Elu 10 ሰከንድ እስክስታ ትውረድ!",
        sound: "horn"
      },
      {
        top: "VIP BOSS 😎",
        bg: "linear-gradient(135deg, #0077b6, #03045e)",
        svg: `<svg width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="#06d6a0" stroke="#fff" stroke-width="4"/>
          <rect x="24" y="42" width="32" height="18" rx="4" fill="#000"/>
          <rect x="64" y="42" width="32" height="18" rx="4" fill="#000"/>
          <line x1="56" y1="48" x2="64" y2="48" stroke="#000" stroke-width="4"/>
          <path d="M40 78 Q60 94 80 78" stroke="#000" stroke-width="5" fill="none" stroke-linecap="round"/>
        </svg>`,
        caption: "ትክክለኛውን ሳጥን በአንዴ ስታገኝ!",
        dare: "👑 የመረጠውን ሰው ስም ጠርተሽ Follow አድርጊው!",
        sound: "win"
      },
      {
        top: "ተሸወድክ! 🤡",
        bg: "linear-gradient(135deg, #6a040f, #370617)",
        svg: `<svg width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="62" r="48" fill="#fff" stroke="#ffd166" stroke-width="4"/>
          <circle cx="44" cy="52" r="6" fill="#000"/><circle cx="76" cy="52" r="6" fill="#000"/>
          <circle cx="60" cy="66" r="11" fill="#fe2c55"/>
          <path d="M38 82 Q60 100 82 82" stroke="#fe2c55" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>`,
        caption: "ትልቅ ሽልማት ይወጣል ብለህ ሳጥኑን ስትከፍት...",
        dare: "😂 ባዶ ሳጥን ነው! ሌላ ቁጥር ጻፍ!",
        sound: "sad"
      },
      {
        top: "THIS IS FINE 🔥",
        bg: "linear-gradient(135deg, #d00000, #9d0208)",
        svg: `<svg width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="#ffd166" stroke="#fff" stroke-width="4"/>
          <circle cx="43" cy="50" r="6" fill="#000"/><circle cx="77" cy="50" r="6" fill="#000"/>
          <text x="14" y="102" font-size="26">🔥🔥🔥</text>
        </svg>`,
        caption: "ተቃራኒው ቡድን በ 20,000 ነጥብ ሲመራና ፈገግ ስትይ!",
        dare: "💧 1 ብርጭቆ ውሃ ጠጪና ተረጋጊ!",
        sound: "boom"
      },
      {
        top: "ልቤ ቀለጠ 😍",
        bg: "linear-gradient(135deg, #f72585, #b5179e)",
        svg: `<svg width="110" height="110" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="52" fill="#ffd166" stroke="#fff" stroke-width="4"/>
          <text x="24" y="58" font-size="26">❤️❤️</text>
          <path d="M40 76 Q60 96 80 76" stroke="#fe2c55" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>`,
        caption: "Elu 🧊 ፈገግ ስትል መላው ቻት ሲቀልጥ!",
        dare: "😘 ለቻቱ አንድ ትልቅ Kiss እና ሰላምታ ላኪ!",
        sound: "win"
      }
    ];

    let currentMemes = [];
    let openedCount = 0;
    let lastEventId = 0;
    let autoCloseTimer = null;

    function initBoxes() {
      const grid = document.getElementById("boxGrid");
      grid.innerHTML = "";
      openedCount = 0;
      currentMemes = [...MEMES].sort(() => Math.random() - 0.5);
      currentMemes.forEach((meme, i) => {
        const div = document.createElement("div");
        div.className = "m-box";
        div.id = "box-" + (i + 1);
        div.innerHTML = `<div class="m-icon">🎁</div><div class="m-num">ቁጥር ${i + 1}</div>`;
        div.onclick = () => triggerBox(i + 1, "Manual Tap");
        grid.appendChild(div);
      });
    }

    function triggerBox(boxNum, pickerName) {
      const idx = Math.max(0, Math.min(5, boxNum - 1));
      const div = document.getElementById("box-" + (idx + 1));
      const meme = currentMemes[idx];
      if (!div || !meme) return;

      document.getElementById("liveLog").textContent = `🎉 ${pickerName} ሳጥን #${idx + 1} መረጠ!`;
      div.classList.add("shaking");

      setTimeout(() => {
        div.classList.remove("shaking");
        if (!div.classList.contains("opened")) {
          div.classList.add("opened");
          openedCount++;
        }
        div.innerHTML = `<div class="m-icon">😂</div><div class="m-mini-tag">${meme.top}</div>`;
        openMemeModal(meme, pickerName, idx + 1);

        // Auto-refill all boxes if all 6 have been opened
        if (openedCount >= 6) {
          setTimeout(() => {
            initBoxes();
            document.getElementById("liveLog").textContent = "🔄 ሁሉም ሳጥኖች ስለተከፈቱ አዲስ ዙር ተጀምሯል!";
          }, 5500);
        }
      }, 400);
    }

    function openMemeModal(meme, pickerName, boxNum) {
      document.getElementById("pickerBanner").textContent = `👤 ${pickerName} — ሳጥን #${boxNum}`;
      document.getElementById("memeTop").textContent = meme.top;
      const art = document.getElementById("memeArt");
      art.style.background = meme.bg;
      art.innerHTML = meme.svg;
      document.getElementById("memeCaption").textContent = meme.caption;
      document.getElementById("memeDare").textContent = meme.dare;
      document.getElementById("memeModal").style.display = "flex";
      playFx(meme.sound);

      clearTimeout(autoCloseTimer);
      autoCloseTimer = setTimeout(closeMeme, 5000);
    }

    function closeMeme() {
      document.getElementById("memeModal").style.display = "none";
    }

    // Direct connection polling to Termux TikTokLive server
    setInterval(async () => {
      try {
        const res = await fetch("/state");
        const data = await res.json();
        const pill = document.getElementById("connPill");
        if (data.connected) {
          pill.textContent = "🟢 @" + data.username;
          pill.classList.add("live");
        } else if (data.error) {
          pill.textContent = "⚠️ OFFLINE";
          document.getElementById("liveLog").textContent = data.error;
        }
        for (const ev of data.events) {
          if (ev.id > lastEventId) {
            lastEventId = ev.id;
            triggerBox(ev.box, ev.user);
          }
        }
      } catch (e) {}
    }, 350);

    initBoxes();
  </script>
</body>
</html>
